[package]
name = "vk-mobile-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
base64 = "0.22"
boringtun = "=0.7.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
async-trait = "0.1"
dtls = { package = "webrtc-dtls", version = "=0.7.2" }
srtp = { package = "webrtc-srtp", version = "=0.10.0" }
turn = "=0.6.1"
util = { package = "webrtc-util", version = "0.7", features = ["conn"] }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
sha2 = "0.10"
hex = "0.4"
getrandom = "0.2"
