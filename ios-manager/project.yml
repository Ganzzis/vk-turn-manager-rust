name: VKServerManager
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  ServerManager:
    path: .
targets:
  VKServerManager:
    type: application
    platform: iOS
    sources:
      - App
      - path: ServerBundle
        type: folder
        buildPhase: resources
    dependencies:
      - package: ServerManager
        product: ManagerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.ganzzis.vkturn.server-manager
        MARKETING_VERSION: "0.3.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: VK TURN Manager
        CFBundleDevelopmentRegion: ru
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: Подключение к серверу по SSH в локальной сети.
schemes:
  VKServerManager:
    build:
      targets:
        VKServerManager: all
    archive:
      config: Release
