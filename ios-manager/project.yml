name: VKServerManager
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  ServerManager:
    path: .
targets:
  VKServerManager:
    type: application
    platform: iOS
    sources:
      - App
      - path: ServerBundle
        type: folder
        buildPhase: resources
    dependencies:
      - package: ServerManager
        product: ManagerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.ganzzis.vkturn.server-manager
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "3"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Simulator.entitlements
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: VK TURN Manager
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: ru
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: Подключение к серверу по SSH в локальной сети.
  VKServerManagerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - UITests
    dependencies:
      - target: VKServerManager
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.ganzzis.vkturn.server-manager.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: VKServerManager
schemes:
  VKServerManager:
    build:
      targets:
        VKServerManager: all
        VKServerManagerUITests: [test]
    test:
      targets: [VKServerManagerUITests]
    archive:
      config: Release
