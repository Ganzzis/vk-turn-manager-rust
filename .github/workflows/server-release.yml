name: Server release artifacts

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.100.0 --profile minimal
      - name: Build and verify reproducible packaging
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          bash scripts/package-server-release.sh "$RELEASE_TARGET" dist
          CARGO_TARGET_DIR="$RUNNER_TEMP/release-repeat-target" \
            bash scripts/package-server-release.sh "$RELEASE_TARGET" "$RUNNER_TEMP/repeat"
          for archive in dist/*.tar.gz; do
            cmp "$archive" "$RUNNER_TEMP/repeat/${archive##*/}"
          done
      - name: Verify native arm64 installation
        if: matrix.arch == 'arm64' && github.event_name == 'pull_request'
        run: bash tests/ubuntu-install.sh target/aarch64-unknown-linux-gnu/release/vk-turn-manager
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: server-package-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  checksums:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: server-package-*
          path: dist
          merge-multiple: true
      - name: Generate and verify SHA-256 manifest
        working-directory: dist
        run: |
          set -euo pipefail
          export LC_ALL=C
          shopt -s nullglob
          amd64=(vk-turn-manager-v*-linux-amd64.tar.gz)
          arm64=(vk-turn-manager-v*-linux-arm64.tar.gz)
          [[ ${#amd64[@]} == 1 && ${#arm64[@]} == 1 ]]
          [[ ${amd64[0]%-linux-amd64.tar.gz} == "${arm64[0]%-linux-arm64.tar.gz}" ]]
          cp ../install.sh ./install.sh
          sha256sum "${amd64[0]}" "${arm64[0]}" install.sh > SHA256SUMS
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: server-release-bundle
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/install.sh
          if-no-files-found: error
          retention-days: 7
