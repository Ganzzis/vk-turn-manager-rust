name: Rust CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --locked
      - name: Test manager CLI deployment and rollback
        run: bash tests/deploy-manager.sh
      - name: Build Linux x86-64 binary
        run: cargo build --locked --release
      - name: Install and remove services on Ubuntu 24.04
        run: bash tests/ubuntu-install.sh target/release/vk-turn-manager
      - uses: actions/upload-artifact@v6
        with:
          name: vk-turn-manager-linux-amd64
          path: target/release/vk-turn-manager
          if-no-files-found: error
          retention-days: 7

  clean-install:
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['24.04', '26.04']
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - run: cargo build --locked --release
      - name: Install VM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils ovmf
      - name: Install, update, reboot and remove on clean Ubuntu
        env:
          UBUNTU_VERSION: ${{ matrix.ubuntu }}
        run: bash tests/ubuntu-reboot.sh target/release/vk-turn-manager "$UBUNTU_VERSION"

  upstream-ios-srtp:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.0'
          cache: false
      - name: Verify upstream iOS DTLS-SRTP datagrams over loopback
        run: bash tests/ios-srtp.sh
