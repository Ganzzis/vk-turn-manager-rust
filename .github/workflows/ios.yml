name: iOS CI

on:
  push:
    branches: [main]
    paths: ['ios/**', 'tests/fixtures/upstream-ios-import.url', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', 'tests/fixtures/upstream-ios-import.url', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relay-interoperability:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Fetch and verify the pinned SRTP server
        run: |
          set -euo pipefail
          server="$RUNNER_TEMP/server-linux-amd64"
          curl --fail --silent --show-error --location \
            https://github.com/anton48/vk-turn-proxy/releases/download/srtp-build478/server-linux-amd64 -o "$server"
          printf '%s  %s\n' 21b4c5e02c8b6658521d17ecbbc2f25487b2cd9f863a7ff70a0a66783af63e98 "$server" | sha256sum -c -
          chmod 700 "$server"
          printf 'VK_SRTP_SERVER=%s\n' "$server" >> "$GITHUB_ENV"
      - name: Verify WireGuard via local TURN and upstream DTLS-SRTP
        run: cargo test --manifest-path ios/Core/Cargo.toml --locked wireguard_through_turn_and_build478 -- --ignored
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install build tools
        run: |
          rustup toolchain install 1.100.0 --profile minimal --component rustfmt
          rustup override set 1.100.0
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
          xcodebuild -version
      - name: Test signed IPA validation rules with synthetic profiles
        run: python3 ios/scripts/test-check-signing.py
      - name: Test Rust mobile core
        run: |
          cargo fmt --manifest-path ios/Core/Cargo.toml --all -- --check
          cargo test --manifest-path ios/Core/Cargo.toml --locked
      - name: Build Rust static libraries for device and simulator
        run: bash ios/scripts/build-core.sh
      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate
      - name: Build and test on the iOS simulator
        working-directory: ios
        run: |
          set -euo pipefail
          device=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, devices in runtimes.items()
                     if ".iOS-" in runtime
                     for d in devices if d["name"].startswith("iPhone")))
          ')
          xcodebuild test -project VKMobile.xcodeproj -scheme VKMobile \
            -destination "platform=iOS Simulator,id=$device" \
            -derivedDataPath build/derived -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO
      - name: Build unsigned device archive
        working-directory: ios
        run: |
          xcodebuild archive -project VKMobile.xcodeproj -scheme VKMobile \
            -destination 'generic/platform=iOS' -archivePath build/VKMobile.xcarchive \
            CODE_SIGNING_ALLOWED=NO
      - name: Package unsigned archive and source notices
        working-directory: ios
        run: |
          application=build/VKMobile.xcarchive/Products/Applications/VKMobile.app
          test -f "$application/VKMobile"
          test -f "$application/PlugIns/PacketTunnel.appex/PacketTunnel"
          mkdir -p build/distribution
          ditto -c -k --keepParent build/VKMobile.xcarchive build/distribution/VKMobile-unsigned.zip
          python3 scripts/notices.py build/distribution/third-party-notices
      - uses: actions/upload-artifact@v6
        with:
          name: VKMobile-unsigned-device-archive
          path: ios/build/distribution
          if-no-files-found: error
          retention-days: 7
